name: Windows checks and installer
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run typecheck
      - run: npm.cmd test
      - run: npm.cmd run build
      - run: npm.cmd run test:electron
      - run: npm.cmd run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: bear-cave-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
